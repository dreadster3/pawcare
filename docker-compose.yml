services:
  keycloak:
    image: keycloak/keycloak:latest
    command: start --import-realm
    profiles:
      - idp
    depends_on:
      - keycloak-db
    ports:
      - 8080:8080
    environment:
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: true
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db/keycloak
      KC_DB_USER: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HTTP_ENABLED: true
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_PASSWORD}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
    networks:
      - default
    volumes:
      - ./docker/idp/realm.json:/opt/keycloak/data/import/realm.json
    restart: always

  keycloak-db:
    image: postgres:17
    profiles:
      - idp
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: ${KEYCLOAK_DB_USER}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - keycloak_data:/var/lib/postgresql/data
    restart: always

  kong:
    image: kong:latest
    profiles:
      - gateway
    environment:
      KONG_PROXY_LISTEN: "0.0.0.0:8000, 0.0.0.0:8443 ssl"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_ADMIN_GUI_LISTEN: "0.0.0.0:8002"
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_PREFIX: /var/run/kong
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /opt/kong/kong.yml
      KONG_SSL_CERT: /run/secrets/kong_cert
      KONG_SSL_CERT_KEY: /run/secrets/kong_key
    ports:
      - 80:8000
      - 8001:8001
      - 8002:8002
      - 443:8443
      - 8444:8444
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: on-failure:5
    volumes:
      - kong_prefix:/var/run/kong
      - kong_tmp:/tmp
      - ./docker/gateway/kong.yml:/opt/kong/kong.yml
    secrets:
      - kong_cert
      - kong_key
    networks:
      - default
      - gateway

  accounts:
    build:
      context: .
      dockerfile: ./services/account/Dockerfile
    environment:
      PAWCARE_DB_HOST: ${DB_HOST}
      PAWCARE_DB_PORT: ${DB_PORT}
      PAWCARE_DB_USER: ${DB_USER}
      PAWCARE_DB_PASS: ${DB_PASS}
      PAWCARE_CERTS_ENDPOINT: http://keycloak:8080/realms/pawcare/protocol/openid-connect/certs
      PAWCARE_INSECURE_SKIP_VERIFY: true
    networks:
      - default

  medical:
    build:
      context: .
      dockerfile: ./services/medical/Dockerfile
    environment:
      PAWCARE_DB_HOST: ${DB_HOST}
      PAWCARE_DB_PORT: ${DB_PORT}
      PAWCARE_DB_USER: ${DB_USER}
      PAWCARE_DB_PASS: ${DB_PASS}
      PAWCARE_CERTS_ENDPOINT: http://keycloak:8080/realms/pawcare/protocol/openid-connect/certs
      PAWCARE_INSECURE_SKIP_VERIFY: true
      PAWCARE_PET_SERVICE_HOST: accounts:81
    networks:
      - default

networks:
  gateway:
    driver: bridge
  default:
    driver: bridge

volumes:
  kong_prefix:
    driver_opts:
      type: tmpfs
      device: tmpfs
  kong_tmp:
    driver_opts:
      type: tmpfs
      device: tmpfs
  keycloak_data:
    driver: local

secrets:
  kong_cert:
    file: ./docker/gateway/certificate.cert
  kong_key:
    file: ./docker/gateway/certificate.key
