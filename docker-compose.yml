services:
  kong:
    image: kong:latest
    environment:
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_ADMIN_GUI_LISTEN: "0.0.0.0:8002"
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_PREFIX: /var/run/kong
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: "/opt/kong/kong.yml"
    ports:
      - 80:8000
      - 8001:8001
      - 8002:8002
      - 8443:8443
      - 8444:8444
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: on-failure:5
    volumes:
      - kong_prefix:/var/run/kong
      - kong_tmp:/tmp
      - ./gateway:/opt/kong
    networks:
      - default
      - gateway

  accounts:
    build:
      context: .
      dockerfile: ./services/account/Dockerfile
    environment:
      PAWCARE_DB_HOST: ${DB_HOST}
      PAWCARE_DB_PORT: ${DB_PORT}
      PAWCARE_DB_USER: ${DB_USER}
      PAWCARE_DB_PASS: ${DB_PASS}
      PAWCARE_CERTS_ENDPOINT: ${CERTS_ENDPOINT}
      PAWCARE_INSECURE_SKIP_VERIFY: true
    networks:
      - default

  medical:
    build:
      context: .
      dockerfile: ./services/medical/Dockerfile
    environment:
      PAWCARE_DB_HOST: ${DB_HOST}
      PAWCARE_DB_PORT: ${DB_PORT}
      PAWCARE_DB_USER: ${DB_USER}
      PAWCARE_DB_PASS: ${DB_PASS}
      PAWCARE_CERTS_ENDPOINT: ${CERTS_ENDPOINT}
      PAWCARE_INSECURE_SKIP_VERIFY: true
      PAWCARE_PET_SERVICE_HOST: accounts:81
    networks:
      - default

networks:
  gateway:
    driver: bridge
  default:
    driver: bridge

volumes:
  kong_data:
    driver: local
  kong_prefix:
    driver_opts:
      type: tmpfs
      device: tmpfs
  kong_tmp:
    driver_opts:
      type: tmpfs
      device: tmpfs
